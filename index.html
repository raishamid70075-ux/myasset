<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Galeri Ilham</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'DM Sans', sans-serif; }
        body {
            background-color: #0c0c0c;
            color: #e8e2d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: #141414;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            width: 100%;
            max-width: 360px;
        }
        h2 {
            font-family: 'DM Serif Display', serif;
            text-align: center;
            margin-bottom: 24px;
            font-size: 2rem;
            color: #c8a96e; /* Warna aksen galeri kamu */
        }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #555; text-transform: uppercase; letter-spacing: 0.08em;}
        input {
            width: 100%; padding: 12px; background: #0c0c0c; border: 1px solid #333;
            border-radius: 4px; color: #e8e2d9; outline: none; transition: border 0.3s;
        }
        input:focus { border-color: #c8a96e; }
        button {
            width: 100%; padding: 12px; background: #c8a96e; color: #0c0c0c;
            border: none; border-radius: 4px; cursor: pointer; font-weight: 500;
            text-transform: uppercase; letter-spacing: 0.05em; transition: opacity 0.3s;
        }
        button:hover { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #message { margin-top: 15px; text-align: center; font-size: 0.85rem; min-height: 20px; }
        .error { color: #ef4444; }
        .success { color: #4ade80; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Masuk</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="loginBtn">Login</button>
        </form>
        <div id="message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
